
name: Build Orthopedic Clinic APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        working-directory: OrthopedicClinic
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: OrthopedicClinic
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OrthopedicClinic-APK
          path: OrthopedicClinic/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
